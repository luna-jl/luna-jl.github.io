<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Luna</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0d0d0d;
      color: #e8e8e8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    header { text-align: center; margin-bottom: 3rem; }
    header h1 { font-size: 2rem; font-weight: 600; letter-spacing: -0.5px; }
    header p { margin-top: 0.5rem; color: #888; font-size: 0.95rem; }
    #app-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1rem;
      width: 100%;
      max-width: 800px;
    }
    .app-card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      padding: 1.25rem 1.5rem;
      text-decoration: none;
      color: inherit;
      transition: border-color 0.15s, background 0.15s;
    }
    .app-card:hover { border-color: #555; background: #222; }
    .app-card h2 { font-size: 1rem; font-weight: 500; }
    .app-card p { font-size: 0.8rem; color: #777; margin-top: 0.3rem; }
    .empty { color: #555; font-size: 0.9rem; text-align: center; }
    footer { margin-top: 4rem; color: #444; font-size: 0.8rem; }
    footer a { color: #666; text-decoration: none; }
    footer a:hover { color: #aaa; }
  </style>
</head>
<body>
  <header>
    <h1>Luna</h1>
    <p>Static apps &amp; pages</p>
  </header>

  <div id="app-grid"></div>

  <footer>
    <a href="https://judgmentlabs.ai" target="_blank" rel="noopener">Judgment Labs</a>
  </footer>

  <script>
    // Register apps here: { name, description, path }
    const APPS = [
      // { name: "My App", description: "Short description", path: "/apps/my-app/" },
    ];

    const grid = document.getElementById("app-grid");
    if (APPS.length === 0) {
      grid.innerHTML = '<p class="empty">No apps deployed yet.</p>';
    } else {
      APPS.forEach(app => {
        const a = document.createElement("a");
        a.className = "app-card";
        a.href = app.path;
        a.innerHTML = `<h2>${app.name}</h2><p>${app.description}</p>`;
        grid.appendChild(a);
      });
    }
  </script>
</body>
</html>
